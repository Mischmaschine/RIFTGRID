{{- range $name := list "api" "worker" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: riftgrid-{{ $name }}, labels: { app.kubernetes.io/name: riftgrid-{{ $name }} } }
spec:
  replicas: {{ index $.Values.replicas $name }}
  selector: { matchLabels: { app.kubernetes.io/name: riftgrid-{{ $name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: riftgrid-{{ $name }} } }
    spec:
      serviceAccountName: riftgrid-control-plane
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name }}
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, runAsNonRoot: true }
          envFrom: [{ secretRef: { name: riftgrid-runtime } }]
          env:
            - { name: KUBERNETES_NAMESPACE, value: {{ $.Values.gameNamespace | quote }} }
            - { name: WEB_ORIGIN, value: {{ $.Values.webOrigin | quote }} }
            - { name: NEXT_PUBLIC_API_URL, value: {{ $.Values.publicApiUrl | quote }} }
          resources: {{ toYaml (index $.Values.resources $name) | nindent 12 }}
          {{- if ne $name "worker" }}
          ports: [{ name: http, containerPort: {{ if eq $name "api" }}4000{{ else }}3000{{ end }} }]
          readinessProbe: { httpGet: { path: {{ if eq $name "api" }}/health{{ else }}/{{ end }}, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          {{- end }}
---
{{- if ne $name "worker" }}
apiVersion: v1
kind: Service
metadata: { name: riftgrid-{{ $name }} }
spec:
  selector: { app.kubernetes.io/name: riftgrid-{{ $name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
{{- end }}
{{- end }}
