apiVersion: v1
kind: ServiceAccount
metadata: { name: riftgrid-control-plane }
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.gameNamespace }}
  labels: { app.kubernetes.io/managed-by: riftgrid }
---
apiVersion: v1
kind: Secret
metadata: { name: riftgrid-runtime }
type: Opaque
stringData:
  DATABASE_URL: {{ required "databaseUrl is required" .Values.databaseUrl | quote }}
  REDIS_URL: {{ required "redisUrl is required" .Values.redisUrl | quote }}
  SESSION_SECRET: {{ required "sessionSecret is required" .Values.sessionSecret | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: riftgrid-node-discovery }
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: riftgrid-node-discovery }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: riftgrid-node-discovery }
subjects: [{ kind: ServiceAccount, name: riftgrid-control-plane, namespace: {{ .Release.Namespace }} }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: riftgrid-game-manager, namespace: {{ .Values.gameNamespace }} }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "persistentvolumeclaims", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: riftgrid-game-manager, namespace: {{ .Values.gameNamespace }} }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: riftgrid-game-manager }
subjects: [{ kind: ServiceAccount, name: riftgrid-control-plane, namespace: {{ .Release.Namespace }} }]
