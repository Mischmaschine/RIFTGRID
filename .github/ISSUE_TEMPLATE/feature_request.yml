name: Feature request
description: Propose a focused product, operator, installer, or adapter improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior rather than only an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Universal control plane
        - Installer
        - Game adapter
        - Web console
        - Storage / backup
        - Networking
        - Security / RBAC
        - Documentation
        - Other
  - type: textarea
    id: safety
    attributes:
      label: State and data considerations
      description: Note desired-state, migration, persistence, secret, and compatibility implications.
